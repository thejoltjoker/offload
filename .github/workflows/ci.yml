name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check offload tests

      - name: Ruff format
        run: uv run ruff format --check offload tests

      - name: Pytest
        run: uv run pytest tests/ -v

      - name: Mypy
        run: uv run mypy offload --no-error-summary 2>/dev/null || true
